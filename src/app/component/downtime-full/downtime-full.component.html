@if (visible()) {
  <div
    class="downtime-full"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="downtime-full-title"
    aria-describedby="downtime-full-message"
    [class.is-dark]="css().theme === 'dark'"
    [style.--dt-bg]="css().backgroundColor"
    [style.--dt-text]="css().textColor"
    [style.--dt-primary]="css().primaryColor"
  >
    <div class="downtime-full-card">
      <div class="downtime-full-icon" aria-hidden="true">
        @if (imageIcon()) {
          <img [src]="icon()" alt="" />
        } @else {
          <mat-icon>{{ materialIcon() }}</mat-icon>
        }
      </div>
      <h1 id="downtime-full-title" class="downtime-full-title">{{ title() }}</h1>
      <p id="downtime-full-message" class="downtime-full-message">{{ message() }}</p>
      @if (appLink(); as link) {
        <a class="downtime-full-link" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
        @if (link.hint) {
          <p class="downtime-full-hint">{{ link.hint }}</p>
        }
      }
    </div>
  </div>
}
