<div class="zip-dialog">
  <div class="zip-dialog-header">
    <h3 class="zip-dialog-title" i18n>Following files or folders have special characters in their names</h3>
    <p class="zip-dialog-subtitle" i18n>Rename them, zip the package again and upload it.</p>
    <button type="button" class="zip-dialog-close" aria-label="Close" i18n-aria-label (click)="dismiss.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!--
    The id is load-bearing: both hosts look this element up by id after opening
    the dialog and rewrite its children to highlight the offending characters.
  -->
  <div class="zip-dialog-body" id="errorFiles">
    @for (name of names; track name) {
      <div class="zip-invalid-name">{{ name }}</div>
    }
  </div>

  <div class="zip-dialog-footer">
    <button type="button" class="zip-btn zip-btn-primary" (click)="acknowledged.emit()" i18n>I Understand</button>
  </div>
</div>
