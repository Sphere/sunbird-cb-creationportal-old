<div class="st-wrap">
  <div class="st-header">
    <div class="st-header-left">
      <span class="st-header-icon">
        <span class="material-icons">timeline</span>
      </span>
      <p class="st-title" i18n>Action Overview</p>
    </div>
    <button *ngIf="isDialog" class="st-close-btn" mat-dialog-close aria-label="Close" i18n-aria-label>
      <span class="material-icons">close</span>
    </button>
  </div>

  <div class="st-body">
    <div class="progress" *ngIf="workFlow.length">
      <div
        class="progress-step"
        [class.active]="state.isActive"
        [class.complete]="state.isCompleted"
        *ngFor="let state of workFlow; let i = index"
      >
        <ws-auth-status-display [needStyle]="false" [status]="state.processName"></ws-auth-status-display>
        <div class="info" *ngIf="state.isCompleted && state.name">
          - {{ state.name }} <br />
          on {{ state.date | date }}
        </div>
        <div class="info" *ngIf="state.isActive && state.owner">Pending with {{ state.owner }}</div>
        <div class="info" *ngIf="!state.isActive && !state.isCompleted && state.owner">Assigned to {{ state.owner }}</div>
      </div>
    </div>
    <button type="button" *ngIf="isClient1" (click)="showModal = true" class="btn-reset btn-block st-full-flow">
      <span class="cursor-pointer" i18n>Complete Flow</span>
    </button>
  </div>
</div>

<div class="custom-modal" [class.showModal]="showModal">
  <button type="button" (click)="showModal = false" class="btn-reset modal-close cursor-pointer" aria-label="Close" i18n-aria-label>
    &times;
  </button>
  <img alt="" src="/assets/images/authoring/client1.png" class="modal-image" />
</div>
