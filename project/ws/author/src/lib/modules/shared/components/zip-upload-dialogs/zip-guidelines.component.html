<div class="zip-dialog">
  <div class="zip-dialog-header">
    <h3 class="zip-dialog-title" id="zipGuidelinesTitle" i18n>Guidelines for zip file upload</h3>
    <p class="zip-dialog-subtitle" i18n>Confirm each point before uploading the package.</p>
    <button type="button" class="zip-dialog-close" aria-label="Close" i18n-aria-label (click)="dismiss.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="zip-dialog-body">
    <ul class="zip-guideline-list" aria-labelledby="zipGuidelinesTitle">
      @for (item of items; track item.key) {
        <li
          class="zip-guideline-item"
          [class.is-checked]="condition[item.key]"
          [class.has-error]="condition.isSubmitPressed && !condition[item.key]"
        >
          <label class="zip-guideline-label" [for]="'zipGuidelineCheck-' + item.key">
            <input
              [id]="'zipGuidelineCheck-' + item.key"
              type="checkbox"
              [(ngModel)]="condition[item.key]"
              [attr.aria-describedby]="'zipGuidelineError-' + item.key"
            />
            <span>{{ item.text }}</span>
          </label>
          @if (condition.isSubmitPressed && !condition[item.key]) {
            <div class="zip-guideline-error" [id]="'zipGuidelineError-' + item.key" i18n>Accept the declaration</div>
          }
        </li>
      }
    </ul>
  </div>

  <div class="zip-dialog-footer">
    <button type="button" class="zip-btn zip-btn-secondary" (click)="dismiss.emit()" i18n>Cancel</button>
    <button
      type="button"
      class="zip-btn zip-btn-primary zip-upload-agree"
      [disabled]="disableUntilAccepted && !allAccepted"
      (click)="agree()"
      i18n
    >
      I Agree
    </button>
  </div>
</div>
