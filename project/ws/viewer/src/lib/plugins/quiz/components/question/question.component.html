<div class="question-card">
  <div class="question-header">
    <span class="question-counter">
      <ng-container i18n="question number label">Q</ng-container>{{ questionNumber }}
      <ng-container i18n="question number of total questions"> of </ng-container>{{ total }}
    </span>
    <button aria-label="flag" i18n-aria-label class="flag-btn" (click)="markQuestion()">
      <mat-icon>{{ isQuestionMarked() ? 'flag' : 'outlined_flag' }}</mat-icon>
    </button>
  </div>

  <p *ngIf="question.questionType !== 'fitb'" class="question-text" [innerHTML]="question?.question"></p>
  <p *ngIf="question.questionType === 'fitb'" class="question-text" [innerHTML]="safeQuestion"></p>

  <div class="fitb-answer" *ngIf="question.questionType === 'fitb'">
    <div *ngFor="let option of question?.options; let i = index">
      <div class="correct-answer" *ngIf="option?.isCorrect">{{ i + 1 }} : {{ option?.text }}</div>
      <div
        class="background-well padding-left-m padding-xs"
        *ngIf="option?.hint && (viewState !== 'review' || !unTouchedBlank[i])"
        [ngClass]="{
          'correct-option': viewState === 'review' && correctOption[i],
          'incorrect-option': viewState === 'review' && !correctOption[i],
        }"
      >
        <p class="hint-label" i18n="explanation/hint message for blank label in fill-in-the-blanks">Explanation for blank {{ i + 1 }} :</p>
        <p class="margin-remove" [innerHTML]="option?.hint"></p>
      </div>
    </div>
  </div>

  <!-- Creator preview = answer key: correct options are ticked and every option's hint is shown.
       Multiple choice used to be clickable here while single choice was already read-only. -->
  <div class="quiz-options-list" *ngIf="question.questionType === 'mcq-mca'">
    <ng-container *ngFor="let option of question?.options">
      <div class="option-row option-row--readonly" [class.option-row--correct]="option?.isCorrect">
        <label class="sr-only" [for]="'quiz-mca-option-' + question?.questionId + '-' + option?.optionId">{{ option?.text }}</label>
        <input
          [id]="'quiz-mca-option-' + question?.questionId + '-' + option?.optionId"
          type="checkbox"
          class="option-check"
          [checked]="option?.isCorrect"
          disabled
        />
        <span class="option-text" [class.correct-option]="option?.isCorrect">{{ option?.text }}</span>
        <span *ngIf="option?.isCorrect" class="answer-key-badge" i18n="correct answer badge">Correct</span>
      </div>
      <ng-container *ngTemplateOutlet="optionHint; context: { $implicit: option }"></ng-container>
    </ng-container>
  </div>

  <div *ngIf="question.questionType === 'mcq-sca'" class="quiz-options-list" role="radiogroup">
    <ng-container *ngFor="let option of question?.options">
      <div class="option-row option-row--readonly" [class.option-row--correct]="option?.isCorrect">
        <label class="sr-only" [for]="'quiz-sca-option-' + question?.questionId + '-' + option?.optionId">{{ option?.text }}</label>
        <input
          [id]="'quiz-sca-option-' + question?.questionId + '-' + option?.optionId"
          type="radio"
          class="option-check"
          [name]="'quiz-sca-' + question?.questionId"
          [checked]="option?.isCorrect"
          disabled
        />
        <span class="option-text" [class.correct-option]="option?.isCorrect">{{ option?.text }}</span>
        <span *ngIf="option?.isCorrect" class="answer-key-badge" i18n="correct answer badge">Correct</span>
      </div>
      <ng-container *ngTemplateOutlet="optionHint; context: { $implicit: option }"></ng-container>
    </ng-container>
  </div>

  <div *ngIf="question.questionType === 'mtf'">
    <div (scroll)="repaintEveryThing()" (resize)="repaintEveryThing()">
      <div style="height: auto">
        <div style="display: flex; flex-direction: column" [id]="question.questionId">
          <div *ngFor="let option of question.options; let i = index">
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; height: auto">
              <div [class]="'question' + question.questionId + ' question'" [id]="'c1' + question.questionId + (i + 1)">
                {{ option.text }}
              </div>
              <div [class]="'answer' + question.questionId + ' answer'" [id]="'c2' + question.questionId + (i + 1)">
                {{ option.matchForView }}
              </div>
            </div>
            <br /><br />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="question.questionType === 'mtf' && viewState === 'review' && numConnections && matchHintDisplay.length !== 0"
    style="display: flex; flex-direction: column"
  >
    <p class="hint-label" i18n="option explanation label">Explanation</p>
    <table mat-table [dataSource]="matchHintDisplay" class="mat-elevation-z8">
      <ng-container matColumnDef="text">
        <th mat-header-cell *matHeaderCellDef i18n="mtf explanation Option">Option</th>
        <td mat-cell *matCellDef="let element">{{ element.text }}</td>
      </ng-container>
      <ng-container matColumnDef="hint">
        <th mat-header-cell *matHeaderCellDef i18n="mtf explanation Hint">Hint</th>
        <td mat-cell *matCellDef="let element" [innerHTML]="element.hint"></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['text', 'hint']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['text', 'hint']"></tr>
    </table>
  </div>
</div>

<ng-template #optionHint let-option>
  <div *ngIf="option?.hint" class="answer-key-hint" [class.answer-key-hint--correct]="option?.isCorrect">
    <p class="hint-label" i18n="option explanation label">Explanation</p>
    <div class="margin-remove" [innerHTML]="option?.hint"></div>
  </div>
</ng-template>
