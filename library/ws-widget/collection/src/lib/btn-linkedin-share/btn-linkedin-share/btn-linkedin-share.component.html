<ng-container *ngIf="isSocialMediaLinkedinShareEnabled">
  <button type="button" class="linked-in-link" (click)="openShare()" i18n-aria-label aria-label="Share on LinkedIn">
    <img src="cbp-assets/icons/linked-in.svg" alt="" class="linkedin-img" /><span class="linkedin-text">Share</span>
  </button>
</ng-container>
